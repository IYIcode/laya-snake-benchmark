const GW=12,GH=12,DIRS={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]},ORDER=['UP','DOWN','LEFT','RIGHT'];

// ── 契约原语：与 laya-snake-io.html / Python 端逐字同构（零掩码：cycleCrit mask=false）──
function cidx(x,y){if(y===0)return x===0?0:133+(11-x);const s=1+11*x;return(x%2===0)?s+(y-1):s+(11-y);}
function landOf(nx,ny,snake,food){
  if(nx<0||nx>=GW||ny<0||ny>=GH)return'wall';
  const tail=snake[snake.length-1];
  const inBody=snake.slice(1,-1).some(s=>s[0]===nx&&s[1]===ny);
  const isTail=snake.length>1&&nx===tail[0]&&ny===tail[1];
  const eat=!!food&&nx===food[0]&&ny===food[1];
  if(inBody)return'body';if(isTail)return eat?'body':'vacating';return'free';}
function loopAhead(snake,food){const hi=cidx(snake[0][0],snake[0][1]);
  const Dp=p=>((cidx(p[0],p[1])-hi)%144+144)%144;let m1=144,m2=144;
  for(let i=1;i<snake.length;i++){const dd=Dp(snake[i]);if(i<snake.length-1&&dd<m2)m2=dd;if(dd<m1)m1=dd;}
  return{foodAhead:Dp(food),bodyAhead:m1,bodyGoAhead:m2};}
function loopSafe(snake,food,d){const[hx,hy]=snake[0],[dx,dy]=DIRS[d];const nx=hx+dx,ny=hy+dy;
  const land=landOf(nx,ny,snake,food);if(land==='wall'||land==='body')return false;
  const hi=cidx(hx,hy),cd=((cidx(nx,ny)-hi)%144+144)%144;
  const la=loopAhead(snake,food),df=la.foodAhead,m1=la.bodyAhead,m2=la.bodyGoAhead;
  const eat=!!food&&nx===food[0]&&ny===food[1];return eat?cd<=m1-1:(cd<=m2-1&&cd<=df);}
function gridRows(snake,food){const g=Array.from({length:12},()=>Array(GW).fill('0'));
  snake.forEach((s,i)=>{g[s[1]][s[0]]=i===0?'2':'1';});if(food)g[food[1]][food[0]]='3';return g.map(r=>r.join(''));}
function cycleCrit(snake,food){const[hx,hy]=snake[0],hi=cidx(hx,hy),c={};
  for(const d of ORDER){const[dx,dy]=DIRS[d];const nx=hx+dx,ny=hy+dy;const land=landOf(nx,ny,snake,food);
    const dn=Math.abs(nx-food[0])+Math.abs(ny-food[1]),dc=Math.abs(hx-food[0])+Math.abs(hy-food[1]);
    const rel=dn<dc?'NEARER to food':(dn>dc?'FARTHER from food':'SAME distance');
    c[d]=land==='wall'?`(${nx},${ny}) wall, ${rel}`:`(${nx},${ny}) ${land}, ${rel}, cyc=${((cidx(nx,ny)-hi)%144+144)%144}`;}
  return c;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function curSeg(){return D.segs[S.seg];}
function reset(){S={i:0,score:0,jumps:0,seg:0,snake:D.start.map(p=>p.slice()),food:D.foods[0].slice(),eaten:0,won:false};
  document.getElementById('foot').innerHTML='';document.getElementById('winMask').style.display='none';
  onSegStart();renderAll();}
function onSegStart(){const g=curSeg();
  if(JSON.stringify(cycleCrit(S.snake,S.food))!==JSON.stringify(g.criteria))
    addLog('<span style="color:#ff8d98">⚠ 段'+g.askId+' 开帧实时重算与留档载荷不一致（页面有 bug，请反馈）</span>');
  addLog('段<i>'+g.askId+'</i>/'+D.segs.length+' 收帧于步 '+g.stepsAtAsk+'（分'+g.score+'·跨身'+g.jumpCount+'·身长'+g.len+'·食('+g.food[0]+','+g.food[1]+')）→ 规划 <b>'+g.chain.length+'</b> 手');}
function addLog(t){const f=document.getElementById('foot');const d=document.createElement('div');d.className='ll';d.innerHTML=t;f.appendChild(d);f.scrollTop=f.scrollHeight;}
function stepOnce(){
  if(S.i>=D.dirs.length)return false;
  const g=curSeg();
  if(S.i===g.stepsAtAsk&&!(S.i===0&&S.seg===0)){onSegStart();}
  const d=D.dirs[S.i],[dx,dy]=DIRS[d];
  const nx=S.snake[0][0]+dx,ny=S.snake[0][1]+dy;
  const ate=(nx===S.food[0]&&ny===S.food[1]);
  S.snake.unshift([nx,ny]);
  if(!ate)S.snake.pop();
  S.i++;
  if(ate){S.score++;S.eaten++;
    if(!QUIET)addLog('步 '+S.i+' <i>吃子</i> +1 → 总分 '+S.score+'　'+(S.eaten<D.foods.length?'重新读帧：新食('+D.foods[S.eaten][0]+','+D.foods[S.eaten][1]+')':(D.mode==='free'?'蛇已占满 144 格，无处再发食 → WIN':'食流耗尽 → WIN')));
    if(S.eaten<D.foods.length)S.food=D.foods[S.eaten].slice();
    else{S.won=true;showWin();}
  }
  if(S.seg+1<D.segs.length&&S.i>=D.segs[S.seg+1].stepsAtAsk)S.seg++;
  if(!QUIET)renderAll();
  return !S.won;
}
function showWin(){stop();const m=document.getElementById('winMask');m.style.display='flex';
  const r=D.result;document.getElementById('winH3').textContent=r.cause;
  document.getElementById('winTxt').textContent=r.food+' 分 / '+r.steps+' 手 / '+r.jumps+' 跨身 · '+D.segs.length+' 段逐段读帧 · 同提示词 · 零掩码 · 不限时（实际用时 '+r.elapsed+' 秒）· '+(D.mode==='free'?'环形口径：蛇占满 144 格才判赢':'单趟口径：预洗牌 144 格发完即停');}
function drawBoard(){const c=document.getElementById('cv'),g=c.getContext('2d'),cs=c.width/GW;
  g.clearRect(0,0,c.width,c.height);
  g.strokeStyle='#151d3a';
  for(let k=1;k<GW;k++){g.beginPath();g.moveTo(k*cs,0);g.lineTo(k*cs,c.height);g.stroke();
    g.beginPath();g.moveTo(0,k*cs);g.lineTo(c.width,k*cs);g.stroke();}
  if(S.food&&!S.won){g.fillStyle='#ffcf3d';g.beginPath();g.arc(S.food[0]*cs+cs/2,S.food[1]*cs+cs/2,cs*0.3,0,7);g.fill();}
  for(let j=S.snake.length-1;j>=1;j--){const[x,y]=S.snake[j];g.fillStyle='#11995a';g.fillRect(x*cs+2,y*cs+2,cs-4,cs-4);}
  const[hx,hy]=S.snake[0];g.fillStyle='#25e07f';g.fillRect(hx*cs+1,hy*cs+1,cs-2,cs-2);}
function renderChips(){
  document.getElementById('chips').innerHTML=
    ['步数 <b>'+S.i+'</b>/'+D.dirs.length,'得分 <b>'+S.score+'</b>/'+D.result.food,'跨身 <b>'+S.jumps+'</b>','身长 <b>'+S.snake.length+'</b>/144','段 <b>'+(S.seg+1)+'</b>/'+D.segs.length]
    .map(t=>'<span class="chip">'+t+'</span>').join('');
  document.getElementById('prog').style.width=(100*S.i/D.dirs.length)+'%';}
function renderMid(){
  const won=S.won,g=curSeg();
  document.getElementById('gridBox').innerHTML=gridRows(S.snake,won?null:S.food)
    .map(r=>r.split('').map(ch=>'<span class="g'+ch+'">'+ch+'</span>').join('')).join('<br>');
  const la=won?{foodAhead:'—',bodyAhead:'—',bodyGoAhead:'—'}:loopAhead(S.snake,S.food);
  const k=Math.max(0,Math.min(S.i-g.stepsAtAsk,g.chain.length-1));
  document.getElementById('stKv').innerHTML=
    ['蛇头 <b>('+S.snake[0][0]+','+S.snake[0][1]+')</b>','身长 <b>'+S.snake.length+'</b>/144',
     won?'食物 <b>无 · 满盘</b>':'食物 <b>('+S.food[0]+','+S.food[1]+')</b>',
     '食前行距 <b>'+la.foodAhead+'</b>','身前行距 <b>'+la.bodyAhead+'</b>','除尾行距 <b>'+la.bodyGoAhead+'</b>',
     '跨身计数 <b>'+S.jumps+'</b>','段 <b>'+g.askId+'</b> 第 <b>'+(k+1)+'</b>/'+g.chain.length+' 手']
    .map(t=>'<span class="k">'+t+'</span>').join('');
  if(won){document.getElementById('critBox').innerHTML='<div class="rule">满盘：144 格全被蛇占据，已无处发食 → WIN 全盘吃满。</div>';return;}
  const crit=cycleCrit(S.snake,S.food);
  const pick=S.i<D.dirs.length?D.dirs[S.i]:null;
  document.getElementById('critBox').innerHTML=ORDER.map(kk=>{
    const v=crit[kk],bad=/wall|body/.test(v),sf=loopSafe(S.snake,S.food,kk);
    return '<div class="crit '+(kk===pick?'pick':(bad?'bad':(sf?'':'jump')))+'"><span class="zh">'+CN[kk]+(kk===pick?' ✔':'')+'</span>'+esc(v)
      +' <span style="float:right;font-size:11px;color:'+(sf?'#2f8f56':'#c76b76')+'">'+(sf?'不等式PASS':'不等式FAIL')+'</span></div>';}).join('')
    +'<div class="rule" style="margin-top:6px">✔（金色）= 本手实际走的方向，与右栏链上的金色框一一对应。此面板<b>每一手实时重算</b>——不是只给你看段开帧。</div>';}
function renderChain(){const g=curSeg(),box=document.getElementById('chainBox');
  const curIdx=(S.i>=g.stepsAtAsk)?S.i-g.stepsAtAsk:-1;
  let html='<div style="font-size:12px;color:#8fa2cc;margin-bottom:4px">段 '+g.askId+'　共 '+g.chain.length+' 手　最后一步吃子（橙）</div>';
  html+=g.chain.map((d,j)=>{
    let cls='cchip';
    if(j===g.chain.length-1)cls+=' eat';
    if(j<curIdx)cls+=' done';
    if(j===curIdx&&S.i<D.dirs.length)cls+=' cur';
    return '<span class="'+cls+'" title="步'+(g.stepsAtAsk+j+1)+'">'+AR[d]+'</span>';}).join('');
  box.innerHTML=html;}
function renderScore(){
  document.getElementById('scKv').innerHTML=
    ['得分 <b>'+S.score+'</b>/'+D.result.food,'已完段 <b>'+S.eaten+'</b>/'+D.segs.length,'跨身 <b>'+S.jumps+'</b>','终局 <b>'+D.result.cause+'</b>']
    .map(t=>'<span class="k">'+t+'</span>').join('');
  document.getElementById('dots').innerHTML=D.segs.map((g,k)=>'<span class="dot'+(S.eaten>k?' on':'')+'" title="段'+g.askId+'"></span>').join('');}
function renderDots(){renderScore();}
function renderAll(){drawBoard();renderChips();renderMid();renderChain();renderScore();}
function stop(){running=false;clearTimeout(timer);setRunBtn();}
function setRunBtn(){document.getElementById('btnRun').textContent=running?'⏸ 暂停':'▶ 开始';}
function loop(){if(!running)return;
  if(!stepOnce()){stop();return;}
  timer=setTimeout(loop,1000/parseInt(document.getElementById('spd').value,10));}
function jumpTo(n){stop();QUIET=true;reset();
  while(S.i<n&&!S.won)stepOnce();
  QUIET=false;addLog('—— 跳转至步 '+S.i+'（段 '+(S.seg+1)+'，分 '+S.score+'）——');renderAll();}
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720),st=document.getElementById('stage');
  st.style.transform='scale('+s+')';st.style.transformOrigin='0 0';
  st.style.left=((innerWidth-1280*s)/2)+'px';st.style.top=((innerHeight-720*s)/2)+'px';}
boot();
function boot(){
  const start=d=>{D=d;
    document.getElementById('modeChip').textContent=D.mode==='free'?'发食口径：环形空格随机（填满 144 格才判赢）':'发食口径：单趟预洗牌（144 格发完即停）';
    document.getElementById('segTot').textContent=D.segs.length+' 段逐段';
    document.getElementById('resChip').textContent='终局 '+d.result.food+' 分 / '+d.result.steps+' 手 / '+d.result.jumps+' 跨身 / '+d.result.cause+'（'+d.result.elapsed+' 秒）';
    reset();};
  if(window.__MYRUN__){start(window.__MYRUN__);}
  else fetch('_myrun_data.json').then(r=>r.json()).then(start)
    .catch(()=>{document.getElementById('resChip').textContent='数据加载失败：请用 8895 地址打开或重新构建内嵌版';});
  document.getElementById('btnRun').onclick=()=>{if(S.won)return;running=!running;setRunBtn();if(running)loop();else clearTimeout(timer);};
  document.getElementById('btnStep').onclick=()=>{stop();stepOnce();renderAll();};
  document.getElementById('btnPrevS').onclick=()=>jumpTo(S.seg>0?D.segs[S.seg-1].stepsAtAsk:0);
  document.getElementById('btnNextS').onclick=()=>{if(S.seg+1<D.segs.length)jumpTo(D.segs[S.seg+1].stepsAtAsk);};
  document.getElementById('btnEnd').onclick=()=>jumpTo(D.dirs.length);
  document.getElementById('btnReset').onclick=()=>{stop();reset();};
  document.getElementById('spd').oninput=e=>document.getElementById('spdTxt').textContent=e.target.value+' 手/秒';
  addEventListener('resize',fit);fit();
}
</script>
</body>
</html>
