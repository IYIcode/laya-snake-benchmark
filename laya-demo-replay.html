const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),N=33;
let i=0,timer=null;
function draw(board,snake,food,dead){
  ctx.fillStyle=dead?'#180a12':'#0b0b16';ctx.fillRect(0,0,396,396);
  ctx.fillStyle='#2b2b45';for(let y=0;y<12;y++)for(let x=0;x<12;x++){if((x+y)%2===0)ctx.fillRect(x*N+1,y*N+1,N-2,N-2);}
  ctx.fillStyle='#35e08a';ctx.font='bold 20px monospace';
  ctx.fillText('●',food[0]*N+7,food[1]*N+23);
  snake.forEach((p,k)=>{ctx.fillStyle=k===0?'#4dd2ff':(k%2?'#1f6feb':'#174a8c');
    ctx.fillRect(p[0]*N+2,p[1]*N+2,N-4,N-4);});
  if(dead){ctx.fillStyle='#ff6b6b';ctx.font='bold 15px monospace';
    ctx.fillText('撞死 ↓ '+snake[0][1],snake[0][0]*N+2,snake[0][1]*N+N+14);}
}
function show(r){
  if(!r){return}
  draw(r.board,r.snake,r.food,r.dead);
  document.getElementById('sfood').textContent=r.score;
  document.getElementById('slen').textContent=r.len||3;
  document.getElementById('sstep').textContent=r.step;
  document.getElementById('schoice').textContent=r.choice+(r.ate?' 🍃':'')+(r.dead?' 💥':'');
  document.getElementById('stepno').textContent=r.step+' / '+LOG.length;
  document.getElementById('fill').style.width=(r.step/LOG.length*100)+'%';
  let o='';
  for(const d of ['UP','DOWN','LEFT','RIGHT']){
    const v=r.opts[d];const cls=d===r.choice?'pick':(v==='BLOCKED'?'bl':'dim');
    o+=`<span class="mono ${cls}">${d} ${v}</span>`;
  }
  document.getElementById('opts').innerHTML=o;
}
function step(){if(i>=LOG.length){pause();return}show(LOG[i]);i++;}
function play(){pause();timer=setInterval(step,420);}
function pause(){if(timer){clearInterval(timer);timer=null;}}
function seek(e){const t=document.getElementById('track');const f=(e.clientX-t.offsetLeft)/t.width;
  i=Math.max(0,Math.min(LOG.length,Math.round(f*LOG.length)));step();}
document.getElementById('bplay').onclick=play;
document.getElementById('bpause').onclick=pause;
document.getElementById('breset').onclick=()=>{i=0;step();};
document.getElementById('track').onclick=seek;
step();play();
