<title>Jev 的平替 Laya，能否干活？——动画实测报告</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232b3a;--fg:#e8edf5;--dim:#8b97ab;
--gold:#f0b429;--green:#3ecf8e;--red:#ef5b5b;--blue:#5aa7f0;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--fg);font-size:18px}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--bg);position:relative;flex:0 0 auto;box-shadow:0 0 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
#topbar{height:50px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 36px;border-bottom:1px solid var(--line)}
#topbar .sec{font-size:14px;color:var(--gold);letter-spacing:3px}
#topbar .grow{flex:1}
#topbar .no{font-size:14px;color:var(--dim)}
#topbar button{background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:13px;border-radius:8px;padding:4px 12px;cursor:pointer}
#topbar button:hover,#topbar button.act{color:var(--gold);border-color:var(--gold)}
#deck{flex:1;position:relative}
.slide{position:absolute;inset:0;padding:26px 40px 54px;display:none;flex-direction:column}
.slide.on{display:flex}
h1{font-size:46px;line-height:1.3}
h1 .hl{color:var(--gold)}
h2{font-size:32px;margin-bottom:8px}
h2 .bar{display:inline-block;width:8px;height:26px;background:var(--gold);border-radius:2px;margin-right:12px;vertical-align:-3px}
.sub{font-size:19px;color:var(--dim);margin-bottom:16px}
.grow{flex:1;min-height:0}
.cards{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{font-size:20px;margin-bottom:8px;color:var(--gold)}
.card p,.card li{font-size:16.5px;line-height:1.6;color:#c6cfdd}
.card .big{font-size:40px;font-weight:800;line-height:1.2}
.g{color:var(--green)} .r{color:var(--red)} .y{color:var(--gold)}
.src{position:absolute;left:40px;bottom:10px;font-size:12px;color:#4d586b}
.tag{display:inline-block;font-size:14px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--dim);vertical-align:3px}
.tag.n{color:var(--bg);background:var(--gold);border:none;font-weight:700}
.tag.win{color:#0b0e14;background:var(--green);border:none;font-weight:700}
.tag.lose{color:#fff;background:var(--red);border:none;font-weight:700}
/* 动画 */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}70%{transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes groww{from{width:0}to{width:var(--w)}}
@keyframes growh{from{height:0}to{height:var(--h)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(240,180,41,.55)}100%{box-shadow:0 0 0 26px rgba(240,180,41,0)}}
.slide.on .fx{animation:rise .6s cubic-bezier(.22,.8,.28,1) both;animation-delay:var(--d,0s)}
.slide.on .fp{animation:pop .55s cubic-bezier(.3,1.3,.4,1) both;animation-delay:var(--d,0s)}
.slide.on .hbar i{animation:groww 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.hbar{position:relative;height:34px;background:#1a2231;border-radius:8px;overflow:hidden;margin:9px 0}
.hbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c88f16,var(--gold));border-radius:8px}
.hbar.blue i{background:linear-gradient(90deg,#2c6bb5,var(--blue))}
.hbar.red i{background:linear-gradient(90deg,#b23c3c,var(--red))}
.hbar.green i{background:linear-gradient(90deg,#239a66,var(--green))}
.hbar span{position:absolute;left:12px;top:0;line-height:34px;font-size:15.5px;font-weight:700;color:#fff;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hbar em{position:absolute;right:12px;top:0;line-height:34px;font-size:15.5px;font-style:normal;font-weight:800;color:var(--fg);z-index:2}
.vchart{display:flex;align-items:flex-end;gap:26px;height:100%;padding:10px 6px 34px;position:relative}
.vb{flex:1;max-width:112px;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.vb i{display:block;background:linear-gradient(180deg,var(--gold),#a5750d);border-radius:8px 8px 0 0;width:100%;height:var(--h)}
.slide.on .vb i{animation:growh 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.vb u{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-size:14.5px;color:var(--dim);text-decoration:none;line-height:1.3}
.vb b{font-size:17px;color:var(--fg);text-align:center;margin-bottom:5px}
.baseline{position:absolute;left:0;right:0;border-top:2px dashed var(--red);bottom:var(--b)}
.baseline span{position:absolute;right:0;top:-24px;font-size:14.5px;color:var(--red);font-weight:700;background:var(--bg);padding:0 8px}
/* 阶梯 */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.step .ph{flex:0 0 120px;font-size:15px;color:var(--gold);font-weight:700}
.step .bd{flex:1;font-size:16.5px;line-height:1.5;color:#c6cfdd}
.step .res{flex:0 0 150px;text-align:right;font-size:19px;font-weight:800}
/* 概率条 */
.probs{display:flex;flex-direction:column;gap:6px;max-width:520px}
/* 气泡 */
.bub{display:flex;flex-direction:column;gap:14px;max-width:860px}
.b1,.b2{max-width:78%;padding:13px 18px;border-radius:16px;font-size:18px;line-height:1.55}
.b1{align-self:flex-end;background:#1d3550;border:1px solid #2c4b6e;color:#dce8f6;border-bottom-right-radius:4px}
.b1:before{content:"我 · 真实指令";display:block;font-size:12px;color:#7fa6c9;margin-bottom:5px}
.b2{align-self:flex-start;background:var(--panel);border:1px solid var(--line);color:#c6cfdd;font-size:15.5px;border-bottom-left-radius:4px}
.b2:before{content:"Qoder";display:block;font-size:12px;color:var(--gold);margin-bottom:5px}
.b2 .ok{color:var(--green);font-weight:700}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:16.5px}
#ckTabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:6px 14px;font-size:15px;cursor:pointer;font-family:inherit}
#ckTabs button.on,#ckTabs button:hover{color:var(--gold);border-color:var(--gold)}
.tbl th{color:var(--dim);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-size:15px}
.tbl td{padding:8px 10px;border-bottom:1px solid #1a2130;line-height:1.45}
.tbl tr td:first-child{font-weight:600}
/* 话术抽屉 */
#notes{position:absolute;left:0;right:0;bottom:0;max-height:216px;background:rgba(10,13,20,.96);border-top:2px solid var(--gold);padding:14px 40px 16px;overflow:auto;display:none;z-index:9;backdrop-filter:blur(3px)}
#notes.on{display:block}
#notes h4{font-size:14px;color:var(--gold);margin-bottom:8px;letter-spacing:2px}
#notes p{font-size:17px;line-height:1.9;color:#d8e0ee}
/* 导航 */
#nav{position:absolute;right:24px;bottom:10px;display:flex;align-items:center;gap:10px;z-index:5}
#nav button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:16px;width:40px;height:30px;border-radius:8px;cursor:pointer}
#nav button:hover{border-color:var(--gold);color:var(--gold)}
#dots{position:absolute;left:40px;bottom:10px;display:flex;gap:5px;z-index:5}
#dots i{width:9px;height:9px;border-radius:50%;background:#2a3446;cursor:pointer}
#dots i.on{background:var(--gold)}
#prog{position:absolute;top:0;left:0;height:3px;background:var(--gold);z-index:6;transition:width .25s}
/* 封面 */
.cover{justify-content:center;background:radial-gradient(900px 480px at 78% 18%,rgba(240,180,41,.10),transparent 60%),radial-gradient(700px 420px at 12% 88%,rgba(90,167,240,.08),transparent 60%)}
.cover .kicker{font-size:20px;color:var(--gold);letter-spacing:8px;margin-bottom:20px}
.cover h1{font-size:60px}
.cover .q{font-size:25px;color:#c6cfdd;margin:16px 0 30px}
.cover .meta{font-size:16px;color:var(--dim)}
/* 小棋盘 */
#miniWrap{display:flex;gap:26px;align-items:center}
#mini{width:300px;height:300px;border-radius:12px;background:#0d1119;border:1px solid var(--line)}
.blink{animation:blink 1s infinite}
.flash{animation:flash 1.2s infinite}
.small{font-size:14px;color:var(--dim)}
.chip{display:inline-block;background:#1a2231;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:15px;margin:3px 6px 3px 0;color:#c6cfdd}
.chip b{color:var(--gold)}
.ic{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-6px;flex:0 0 auto}
.ic.big36{width:38px;height:38px}
.vs{display:grid;grid-template-columns:1fr 56px 1fr;align-items:stretch}
.vs .mid{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--gold)}
.quote{background:#151b28;border-left:4px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;font-size:19px;color:#d8e0ee;line-height:1.6}
#shotStrip{display:flex;gap:12px;margin-top:12px}
#shotStrip img{height:120px;border-radius:10px;border:1px solid var(--line)}
</style>
</head>

<script>
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);
 const st=document.getElementById('stage');st.style.transform='scale('+s+')';st.style.transformOrigin='center center';}
addEventListener('resize',fit);fit();

const S=[];
function slide(sec,body,note,cls){S.push({sec,body,note,cls:cls||''});}

/* ── 1 封面 ── */
slide('总览',`
<div class="kicker fx" style="--d:.05s">A I 实 测 报 告</div>
<h1 class="fx" style="--d:.2s">Jev 的平替 <span class="hl">Laya</span>，能否干活？</h1>
<div class="q fx" style="--d:.4s">—— 一条贪吃蛇，测出决策小模型的能与不能</div>
<div class="meta fx" style="--d:.6s">convaiinnovations/laya · 421M · 本地部署 · 全部数字来自真实对局日志 · 实测由 Qoder 完成</div>
<div class="fx" style="--d:.9s;margin-top:34px" id="coverSnake"></div>
<div style="position:absolute;right:52px;top:64px"><img class="fp" style="--d:1.15s;width:300px;height:300px;object-fit:cover;border-radius:20px;border:1px solid var(--line);box-shadow:0 0 70px rgba(62,207,142,.18)" src="_ppt_imgs/cover_hero.png" alt="封面徽章：像素蛇缠着芯片、绕着金色底环吃豆（示意）"></div>`,'大家好。今天讲一个 2026 年 9 月很火的话题：Jev——"不聊天、直接做决策"的决策模型，爆火三天之后，开源的 Laya 号称要把它的桌子掀了。我们要回答的问题只有一个：<b>Jev 的平替 Laya，能不能真干活？</b>不念宣传稿，用几百局本地真实对局说话。右上角这枚徽章就是本场主角：缠着芯片的像素蛇、那圈金色底环，就是我们整晚故事发生的地方。','cover');

/* ── 2 三问 ── */
slide('总览',`
<h2><span class="bar"></span>三个问题，一条蛇回答</h2>
<div class="cards grow" style="grid-template-columns:1fr 1fr 1fr;align-content:center">
  <div class="card fp" style="--d:.15s"><div class="big y">问 1</div><p style="font-size:22px;font-weight:700;margin:8px 0"><svg class="ic" style="color:var(--gold)"><use href="#i-help"/></svg> 什么是 Laya？</p><p>不生成文字、不聊天——输入状态+选项，直接输出动作概率的决策小模型。</p></div>
  <div class="card fp" style="--d:.45s"><div class="big y">问 2</div><p style="font-size:22px;font-weight:700;margin:8px 0"><svg class="ic" style="color:var(--gold)"><use href="#i-bolt"/></svg> Laya 能干什么？</p><p>与 Jev 同范式的实时决策：比写死的算法通用，比大模型快、省、可端侧。</p></div>
  <div class="card fp" style="--d:.75s"><div class="big y">问 3</div><p style="font-size:22px;font-weight:700;margin:8px 0"><svg class="ic" style="color:var(--gold)"><use href="#i-archive"/></svg> 实际体验怎么样？</p><p>真实部署、真实训练、真实对局——每个数字都有档案可查。</p></div>
</div>`,'整场汇报围绕三个问题：什么是 Laya；它能干什么；最后，我们亲手用出来的体验到底怎么样。别小看一条贪吃蛇——这三个问题，它全能回答。');

/* ── 3 报告结构 ── */
slide('前言 · 背景',`
<h2><span class="bar"></span>按论文的规矩来</h2>
<div class="steps grow" style="justify-content:center">
  <div class="step fx" style="--d:.1s"><svg class="ic big36" style="color:var(--gold)"><use href="#i-search"/></svg><div class="ph">一 · 背景</div><div class="bd">Jev 爆火，Laya 自称"开源平替"——是真是假？</div><div class="res y">定调</div></div>

</div>`,'方法上像论文一样：背景、方法、结果、结论。每页底部标了数据出处的档案文件名，任何一个数字你都可以要求回放原始日志。');

/* ── 4 Jev vs Laya ── */
slide('前言 · 背景',`
<h2><span class="bar"></span>两位主角 <span class="small">（左图＝擂台：黑塔锁链的闭源正主 vs 小芯片缠蛇的开源平替）</span></h2>

    <img src="_ppt_imgs/jev_laya_arena.png" alt="Jev 与 Laya 对垒示意" style="width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block"></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:12px">
  <div class="card fx" style="--d:.1s;flex:1"><h3>Jev <span class="tag">闭源 · 商业API</span></h3>
    <ul style="list-style:none;line-height:1.95;font-size:17px">
      <li>▪ TypeSafe AI 出品，非自回归并行推理</li>

/* ── 环契约底环示意（第11页左卡：144 格哈密顿环） ── */
(function(){const sv=document.getElementById('ringDia');if(!sv)return;
 function cidx(x,y){if(y===0)return x===0?0:133+(11-x);const s=1+11*x;return(x%2===0)?s+(y-1):s+(11-y);}
 const cells=[];for(let y=0;y<12;y++)for(let x=0;x<12;x++)cells[cidx(x,y)]=[x,y];
 const NS='http://www.w3.org/2000/svg';
 let gd='';for(let i=1;i<12;i++)gd+='M'+i+' 0V12M0 '+i+'H12';
 const grid=document.createElementNS(NS,'path');
 grid.setAttribute('d',gd);grid.setAttribute('stroke','#1a2231');grid.setAttribute('stroke-width','.06');sv.appendChild(grid);
 let d='';cells.forEach((p,i)=>{d+=(i?'L':'M')+(p[0]+.5)+' '+(p[1]+.5);});d+='Z';
 const ring=document.createElementNS(NS,'path');
 ring.setAttribute('d',d);ring.setAttribute('fill','none');ring.setAttribute('stroke','#5aa7f0');
 ring.setAttribute('stroke-width','.14');ring.setAttribute('stroke-opacity','.85');sv.appendChild(ring);
 [[0,0],[1,0]].forEach((c,i)=>{const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',c[0]+.15);r.setAttribute('y',c[1]+.15);r.setAttribute('width',.7);r.setAttribute('height',.7);
  r.setAttribute('rx',.16);r.setAttribute('fill',i?'#239a66':'#3ecf8e');sv.appendChild(r);});
 const f=document.createElementNS(NS,'circle');
 f.setAttribute('cx',cells[70][0]+.5);f.setAttribute('cy',cells[70][1]+.5);f.setAttribute('r',.28);f.setAttribute('fill','#f0b429');sv.appendChild(f);
})();

/* ── 小棋盘动画（环保险算法循环） ── */
(function(){const cv=document.getElementById('mini');if(!cv)return;const ctx=cv.getContext('2d'),C=25;
 function cidx(x,y){if(y===0)return x===0?0:133+(11-x);const s=1+11*x;return(x%2===0)?s+(y-1):s+(11-y);}
 const cells=[];for(let y=0;y<12;y++)for(let x=0;x<12;x++)cells[cidx(x,y)]=[x,y];
 let head=0,len=6,score=0;const foodGap=20;let food=(head+foodGap)%144;
 function draw(){ctx.fillStyle='#0d1119';ctx.fillRect(0,0,300,300);
  ctx.strokeStyle='#1c2432';for(let i=1;i<12;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,300);ctx.moveTo(0,i*C);ctx.lineTo(300,i*C);ctx.stroke();}
  const [fx,fy]=cells[food];ctx.fillStyle='#f0b429';ctx.beginPath();ctx.arc(fx*C+12.5,fy*C+12.5,8+(head%2),0,7);ctx.fill();
  for(let i=len-1;i>=1;i--){const [bx,by]=cells[(head-i+144)%144];ctx.fillStyle=i===len-1?'#2e86c8':'#3ecf8e';ctx.fillRect(bx*C+2,by*C+2,C-4,C-4);}
  const [hx,hy]=cells[head];ctx.fillStyle='#e8edf5';ctx.fillRect(hx*C+2,hy*C+2,C-4,C-4);
  ctx.fillStyle='#8b97ab';ctx.font='13px sans-serif';ctx.fillText('得分 '+score+' · 长度 '+len,8,292);}
 setInterval(()=>{if(!document.getElementById('deck').children[5].classList.contains('on'))return;
  head=(head+1)%144;
  if(head===food){score++;len=Math.min(len+1,60);do{food=(food+7+score*3)%144;}while(((food-head)+144)%144<6);if(score>=40){score=0;len=6;}}
  else len=Math.max(6,len);
  draw();},150);
 draw();})();

 w.innerHTML=s+' <span class="fx" style="--d:2.1s;color:var(--gold);font-size:26px">→</span> <span class="fx blink" style="--d:2.3s;color:var(--gold);font-size:26px">●</span>';})();
