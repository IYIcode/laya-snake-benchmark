<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>选手驾驶舱：每个方法一条贪吃蛇</title>
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232b3a;--fg:#e8edf5;--dim:#8b97ab;--gold:#f0b429;--green:#3ecf8e;--red:#ef5b5b;--blue:#5aa7f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--fg);font-size:17px}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;background:var(--bg);flex:0 0 auto;display:flex;flex-direction:column;position:relative}
#tabs{display:flex;gap:8px;padding:12px 18px 0;flex:0 0 auto}
#tabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-bottom:none;color:var(--dim);
 border-radius:12px 12px 0 0;padding:9px 6px 8px;cursor:pointer;font-size:15.5px;line-height:1.35;font-family:inherit}
#tabs button b{display:block;font-size:16.5px;color:#c6cfdd}
#tabs button i{font-style:normal;font-size:13px}
#tabs button.on{background:#182031;border-color:var(--gold);color:var(--fg)}
#tabs button.on b{color:var(--gold)}
#who{padding:8px 20px 0;font-size:16px;color:var(--dim)}
#who b{color:var(--fg)}
#main{flex:1;display:flex;gap:14px;padding:10px 18px;min-height:0}
#left{flex:1.25;display:flex;flex-direction:column;min-width:0}
#right{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.iobox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;flex:1;min-height:0}
.iobox h4{font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:8px}
.iobox h4 span{color:var(--dim);font-weight:400;letter-spacing:0}
pre.mono{font-family:Consolas,monospace;font-size:13.5px;line-height:1.5;color:#bcd;white-space:pre-wrap;word-break:break-all}
pre.mono .k{color:var(--gold)} pre.mono .ok{color:var(--green)} pre.mono .no{color:var(--red)}
.optrow{background:#182031;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:6px 0;font-size:14px;font-family:Consolas,monospace;line-height:1.45}
.optrow.pick{border-color:var(--gold);background:#232b1d08;box-shadow:0 0 0 1px var(--gold)}
.optrow .dn{color:var(--gold);font-weight:700;font-family:inherit}
.pbar{height:16px;background:#1a2231;border-radius:6px;overflow:hidden;position:relative;margin:3px 0 8px}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c88f16,var(--gold));border-radius:6px}
.pbar.dim i{background:#3a4356}
.pbar span{position:absolute;right:6px;top:0;line-height:16px;font-size:11.5px;color:#fff;z-index:2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{background:#1a2231;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13.5px}
.chip b{color:var(--gold)}
#board{border-radius:12px;border:1px solid var(--line);background:#0d1119}
#rc{width:340px;height:340px;position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;justify-content:center}
#ctl button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 13px;font-size:14px;cursor:pointer;font-family:inherit}
#ctl button:hover{border-color:var(--gold);color:var(--gold)}
#ctl input[type=range]{width:110px}
#ctl .lb{font-size:13px;color:var(--dim)}
#rnotes{margin-top:10px;font-size:14px;color:var(--dim);line-height:1.6;text-align:center}
#rnotes b{color:var(--fg)}
#talk{flex:0 0 auto;background:#151b28;border-top:1px solid var(--line);padding:9px 20px;font-size:15.5px;color:#d8e0ee;line-height:1.6}
#talk:before{content:"🗣 匹配话术　";color:var(--gold);font-weight:700}
#stat{display:flex;gap:10px;justify-content:center;margin-top:8px}
.stat{text-align:center}.stat .v{font-size:22px;font-weight:800;color:var(--gold)}.stat .l{font-size:12.5px;color:var(--dim)}
.big{font-size:22px;font-weight:800}.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}
#ladder{display:flex;flex-direction:column;gap:7px;margin-top:6px}
#ladder .row{display:flex;align-items:center;gap:10px;font-size:14px}
#ladder .row .n{flex:0 0 128px;color:#c6cfdd}
#ladder .row .b{height:18px;background:linear-gradient(90deg,#c88f16,var(--gold));border-radius:5px;min-width:4px}
#ladder .row .v{font-weight:800}
.win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,13,20,.75);
 font-size:30px;font-weight:900;color:var(--green);border-radius:12px;z-index:3}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="tabs"></div>
  <div id="who"></div>
  <div id="main">
    <div id="left" class="iobox"></div>
    <div id="right">
      <div id="rc"><canvas id="board" width="320" height="320"></canvas><div id="winMask" class="win" style="display:none">🏆 141 全盘通关</div></div>
      <div id="stat"></div>
      <div id="ctl"></div>
      <div id="rnotes"></div>
    </div>
  </div>
  <div id="talk"></div>
</div></div>
<script>
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);const st=document.getElementById('stage');
 st.style.transform='scale('+s+')';st.style.transformOrigin='center center';}
addEventListener('resize',fit);fit();

/* ── 引擎原语（与剧院/io 页逐字对齐） ── */
const GW=12,GH=12,KN=['UP','DOWN','LEFT','RIGHT'],DIRS={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function stepSnake(snake,food,d){const[hx,hy]=snake[0],[dx,dy]=DIRS[d];const nx=hx+dx,ny=hy+dy;
 const eat=nx===food[0]&&ny===food[1];const body=eat?snake:snake.slice(0,-1);
 if(nx<0||nx>=GW||ny<0||ny>=GH)return[snake,true,false];
 if(body.some(s=>s[0]===nx&&s[1]===ny))return[snake,true,false];
 const ns=[[nx,ny],...snake];if(!eat)ns.pop();return[ns,false,eat];}
function gridRows(snake,food){const g=Array.from({length:GH},()=>Array(GW).fill('0'));
 snake.forEach((s,i)=>{g[s[1]][s[0]]=i===0?'2':'1';});g[food[1]][food[0]]='3';return g.map(r=>r.join(''));}
function landOf(nx,ny,snake,food){if(nx<0||nx>=GW||ny<0||ny>=GH)return'wall';
 const tail=snake[snake.length-1];const eat=nx===food[0]&&ny===food[1];
 if(snake.slice(1,-1).some(s=>s[0]===nx&&s[1]===ny))return'body';
 if(snake.length>1&&nx===tail[0]&&ny===tail[1])return eat?'body':'vacating';return'free';}
function cidx(x,y){if(y===0)return x===0?0:133+(11-x);const s=1+11*x;return(x%2===0)?s+(y-1):s+(11-y);}
function loopAhead(snake,food){const hi=cidx(snake[0][0],snake[0][1]);
 const D=p=>((cidx(p[0],p[1])-hi)%144+144)%144;let m1=144,m2=144;
 for(let i=1;i<snake.length;i++){const dd=D(snake[i]);if(i<snake.length-1&&dd<m2)m2=dd;if(dd<m1)m1=dd;}
 return{foodAhead:D(food),bodyAhead:m1,bodyGoAhead:m2};}
function loopSafe(snake,food,d){const[hx,hy]=snake[0],[dx,dy]=DIRS[d];const nx=hx+dx,ny=hy+dy;
 const land=landOf(nx,ny,snake,food);if(land==='wall'||land==='body')return false;
 const hi=cidx(hx,hy),cd=((cidx(nx,ny)-hi)%144+144)%144;
 const la=loopAhead(snake,food),df=la.foodAhead,m1=la.bodyAhead,m2=la.bodyGoAhead;
 const eat=nx===food[0]&&ny===food[1];return eat?cd<=m1-1:(cd<=m2-1&&cd<=df);}
function cycOf(snake,d){const hi=cidx(snake[0][0],snake[0][1]),nx=snake[0][0]+DIRS[d][0],ny=snake[0][1]+DIRS[d][1];return((cidx(nx,ny)-hi)%144+144)%144;}
function floodFrom(snake,land){const occ=new Set(snake.map(p=>p[0]+','+p[1]));
 occ.delete(land[0]+','+land[1]);occ.delete(snake[snake.length-1][0]+','+snake[snake.length-1][1]);
 const seen=new Set([land[0]+','+land[1]]);const q=[land];let n=1;
 while(q.length){const[x,y]=q.shift();for(const k of KN){const a=x+DIRS[k][0],b=y+DIRS[k][1],key=a+','+b;
  if(a<0||a>=GW||b<0||b>=GH||seen.has(key)||occ.has(key))continue;seen.add(key);q.push([a,b]);n++;}}
 return n;}
function cycCrit(snake,food,jc){const[hx,hy]=snake[0],hi=cidx(hx,hy),c={};
 for(const d of KN){const[dx,dy]=DIRS[d];const nx=hx+dx,ny=hy+dy;const land=landOf(nx,ny,snake,food);
 const dn=Math.abs(nx-food[0])+Math.abs(ny-food[1]),dc=Math.abs(hx-food[0])+Math.abs(hy-food[1]);
 const rel=dn<dc?'NEARER to food':(dn>dc?'FARTHER from food':'SAME distance');
 c[d]=land==='wall'?`(${nx},${ny}) wall, ${rel}`:`(${nx},${ny}) ${land}, ${rel}, cyc=${((cidx(nx,ny)-hi)%144+144)%144}`;}
 return c;}
const CYCLE_RULES="Snake game, 12 rows of 12 chars: '0' empty, '1' body, '2' head, '3' food. ... Each option lists its landing cell facts and cyc = its forward loop steps from the head. A move is loop-safe if it does not pass your body or the food on the loop: when the move does not eat, cyc <= bodyGoAhead-1 and cyc <= foodAhead; when the move eats, cyc <= bodyAhead-1.";
const JUMP_TAIL="The state also carries jumpCount = how many times earlier in THIS game you already picked a move whose cyc was greater than bodyGoAhead ... your goal is to finish the game with jumpCount = 0.";
const RAW_GRID=["000000000000","000000000000","000000000000","000000000000","000000000000","000000300000","112000000000","000000000000","000000000000","000000000000","000000000000","000000000000"];
function drawGridRows(rows){const ctx=boardCtx,C=320/12;ctx.fillStyle='#0d1119';ctx.fillRect(0,0,320,320);
 ctx.strokeStyle='#1c2432';for(let i=1;i<12;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,320);ctx.moveTo(0,i*C);ctx.lineTo(320,i*C);ctx.stroke();}
 for(let y=0;y<12;y++)for(let x=0;x<12;x++){const ch=rows[y][x];
  if(ch==='1'){ctx.fillStyle='#3ecf8e';ctx.fillRect(x*C+2,y*C+2,C-4,C-4);}
  if(ch==='2'){ctx.fillStyle='#e8edf5';ctx.fillRect(x*C+2,y*C+2,C-4,C-4);}
  if(ch==='3'){ctx.fillStyle='#f0b429';ctx.beginPath();ctx.arc(x*C+C/2,y*C+C/2,7,0,7);ctx.fill();}}}
function drawSnake(snake,food){drawGridRows(gridRows(snake,food));}
const boardCtx=document.getElementById('board').getContext('2d');

/* ── 五条赛道 ── */
const TABS=[
 {id:'zs',   t:'① 未训练模型 · 裸棋盘',   s:'<i class="r">0 分 ×23局 · 实测死亡重放</i>'},
 {id:'fd',   t:'② 微调模型 · 小抄特征',   s:'<i>400 手真日志回放</i>'},
 {id:'cyc',  t:'③ 微调模型 · 环契约+跨身计数', s:'<i class="y">141 实录食物 · 追食回放</i>'},
 {id:'algo', t:'④ 纯代码算法 · 环保险',   s:'<i class="g">141 · 现场真跑</i>'},
 {id:'me',   t:'⑤ 通用 Agent · 我逐段决策', s:'<i class="g">141 · 真实回放</i>'}];
const tabsEl=document.getElementById('tabs');
TABS.forEach(tb=>{const b=document.createElement('button');b.innerHTML='<b>'+tb.t+'</b>'+tb.s;b.dataset.id=tb.id;
 b.onclick=()=>mount(tb.id);tabsEl.appendChild(b);});

let stopLive=null;
function mount(id){stopLive&&stopLive();stopLive=null;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 ({zs:mountZs,fd:mountFd,cyc:mountCyc,algo:mountAlgo,me:mountMe})[id]();}

/* ── ① 零样本（实测死亡规律重放：每步 argmax=UP，6–7 步撞顶墙） ── */
function mountZs(){
 who('决策者：<b>未训练的 Laya 底模</b>（convaiinnovations/laya，421M）。没有算法代劳、没有训练，只有它读提示词。右边按实测行为规律重放：23 局局局 same shape——每步 argmax 都是"上"，第 6–7 步撞顶墙。');
 const st={snake:[[2,6],[1,6],[0,6]],food:[6,5],steps:0,score:0,jumps:0,dead:false,speed:460};
 let auto=null,paused=false,resetT=null;
 hideWin();
 function render(){
  const rows=gridRows(st.snake,st.food);
  document.getElementById('left').innerHTML=`<h4>第 ${st.steps} 步输入 <span>（初始帧=档案原文 _model_input.txt；棋盘按实录死亡轨迹推进）</span></h4>
<pre class="mono">[指令] You are driving a snake in a 12x12 grid game. The board is given as 12 rows of 12 characters: '0' empty, '1' body, '2' head, '3' food. … Choose the direction that leads the head toward the food while staying alive: never step into a wall or into a '1' body cell.

[选项] UP: move one cell up (row-1)   DOWN: …   LEFT: …   RIGHT: …
       <span class="k">← 四个光秃秃的方向，没有小抄</span>

[状态] grid（当前帧，按实录轨迹现算）
${rows.map((r,y)=>' <span class="'+(r.includes('2')?'k':'')+'">'+r+'</span>').join('\n')}</pre>
<h4 style="margin-top:10px">真实输出概率 <span>（第 0 步桥接日志原文；全盘棋盘对四概率的影响实测 ≤0.05，23 局每步 argmax 均为 UP）</span></h4>
${probRows([['上 UP',39,'0.39 ← 本步选择'],['下 DOWN',22,'0.22'],['左 LEFT',19,'0.19'],['右 RIGHT',19,'0.19']],0)}`;
  drawGridRows(rows);
  document.getElementById('stat').innerHTML=
   `<div class="stat"><div class="v r">0</div><div class="l">得分</div></div>
    <div class="stat"><div class="v">${st.steps}</div><div class="l">本局步数</div></div>
    <div class="stat"><div class="v r" style="color:var(--red)">23</div><div class="l">全 0 分局数</div></div>`;
  document.getElementById('rnotes').innerHTML='死法：一路"上"到底，撞顶墙收场<br>透答案给它也只有 <b>5.5</b> 分——生存策略不在文字里';
 }
 function tick(){
  if(st.dead)return;
  const[ns,died]=stepSnake(st.snake,st.food,'UP');
  st.snake=ns;st.steps++;st.dead=died;
  if(died){const m=document.getElementById('winMask');m.style.display='flex';
   m.innerHTML='☠ 第 '+st.steps+' 步撞顶墙 · 得分 0<br><span style="font-size:16px;color:var(--dim)">23 局全这一招法，换种子换食物不换死法</span>';
   resetT=setTimeout(()=>{hideWin();st.snake=[[2,6],[1,6],[0,6]];st.steps=0;st.dead=false;render();},1800);}
  render();
 }
 const ctl=document.getElementById('ctl');
 ctl.innerHTML=`<button id="bP">⏸ 暂停</button><button id="bS">⏭ 单步</button><button id="bR">↻ 重放</button>
 <span class="lb">速度</span><input id="sp" type="range" min="120" max="900" value="460">`;
 ctl.querySelector('#bP').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ 继续':'⏸ 暂停'};
 ctl.querySelector('#bS').onclick=()=>tick();
 ctl.querySelector('#bR').onclick=()=>{if(resetT)clearTimeout(resetT);hideWin();st.snake=[[2,6],[1,6],[0,6]];st.steps=0;st.dead=false;render();};
 ctl.querySelector('#sp').oninput=e=>{st.speed=+e.target.value;restart();};
 function restart(){if(auto)clearInterval(auto);auto=setInterval(()=>{if(!paused&&!st.dead)tick();},st.speed);}
 document.getElementById('winMask').style.display='none';
 render();restart();stopLive=()=>{if(auto)clearInterval(auto);if(resetT)clearTimeout(resetT);};
 talk('第一道：没训练的 Laya 直接上场，右边不是动画演示，是它实测死亡规律的逐步重放。输入就是棋盘数字阵加四个光秃秃的方向——23 局全 0 分，每一局的剧本都一样：概率条几乎均匀、"上"字永远最高（它没读棋盘，在复读语料里 UP 这个词的先验），于是一路向上，第 6 到第 7 步撞顶墙收场。六种提示词写法、甚至把答案透给它：最好也只有 5.5 分，照样撞死。');}

/* ── ② 小抄微调（2026-09-26 深夜桥接 /log 实录 400 手逐手回放） ── */
let REP=null;
function mountFd(){
 who('决策者：<b>微调后的 Laya</b>（v5 谱系）。感知由程序包办：距离/空间/危险度算成"小抄"塞进选项。右边是它 <b>2026-09-26 真实对局的逐手回放</b>（桥接 /log 原档，蛇身按实录头轨迹重建）——模型在线重放需接通桥，按纪律保持停用。');
 const box=document.getElementById('left');
 if(!REP){box.innerHTML='<h4>正在装载真实决策日志 _cockpit_replay.json …</h4>';
  fetch('_cockpit_replay.json').then(r=>r.json()).then(d=>{REP=d;startFd();},
   ()=>{box.innerHTML='<h4 class="r">档案读取失败：请用 http://127.0.0.1:8895 打开本页</h4>';});
  rightBoard({snake:[[6,6],[5,6],[4,6]],food:[6,1],score:0,steps:0,jumps:0,dead:false,won:false});return;}
 startFd();
 function startFd(){
  const F=REP.frames;let i=0,seg=-1,speed=90,auto=null,paused=false,score=0,lastFood=null;
  function render(){
   const f=F[i];
   if(f.seg!==seg){seg=f.seg;score=0;lastFood=null;}
   const eaten=lastFood&&JSON.stringify(lastFood)!==JSON.stringify(f.food);
   if(eaten)score++;lastFood=f.food;
   const rows=gridRows(f.body,f.food);
   document.getElementById('left').innerHTML=`<h4>实录第 ${i+1}/${F.length} 手 · 切片 ${f.seg+1}/3 <span>（每行都是它当年真收到的字符串）</span></h4>
<pre class="mono">[状态] {"game":"snake","board":"12x12","head":[${f.head}],"food":[${f.food}],"facing":"${f.facing}","len":${f.len}}
<span class="k">蛇身</span>：日志只存头坐标，画面按连续 290 手头轨迹重建（与实录 foodDist 抽检一致）

[选项] <span class="k">小抄随步刷新</span></pre>
${KN.map(d=>'<div class="optrow'+(d===f.choice?' pick':'')+'"><span class="dn">'+d+'</span>　'+f.crit[d]+(d===f.choice?'　<b class="y">← 它选了这个</b>':'')+'</div>').join('')}
<h4 style="margin-top:8px">真实概率 <span>（掩码后 / 原始 p 括注；掩码只清物理自杀项）</span></h4>
${KN.map(d=>probRows([[d,Math.round((f.probs[d]||0)*100),(f.probs[d]||0).toFixed(3)+'（raw '+f.raw[d]+'）']],d===f.choice?0:-1)).join('')}
<pre class="mono" style="margin-top:6px;color:var(--dim)">本手推理耗时 ${f.ms} ms · 战报：fdpen6 终版 10 局均值 <span class="k">59.8</span>（同种子 BFS 老师 53 被反超）</pre>`;
   drawGridRows(rows);
   document.getElementById('stat').innerHTML=
    `<div class="stat"><div class="v">${score}</div><div class="l">切片内吃到</div></div>
     <div class="stat"><div class="v">${i+1}</div><div class="l">回放手序</div></div>
     <div class="stat"><div class="v">${f.len}</div><div class="l">蛇长</div></div>`;
   document.getElementById('rnotes').innerHTML='早期 v1 只有 14.8：给"撞墙"选项 0.19–0.24 概率还照选<br>证据帧：嘴边食物 0.281 输给贴墙方向 0.370（PPT 第 9 页）';
  }
  function tick(){i=(i+1)%F.length;render();}
  const ctl=document.getElementById('ctl');
  ctl.innerHTML=`<button id="bP">⏸ 暂停</button><button id="bS">⏭ 单手</button><button id="bN">⟫ 下一切片</button>
  <span class="lb">速度</span><input id="sp" type="range" min="10" max="300" value="90">`;
